name: Bootstrap conventions

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chore/repository-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Philosophy Lab branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Check out pinned coding tooling
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: moritzbrantner/coding-tooling
          ref: 4524918dc26ad9eec85df43c7c11fb08aca6d054
          path: .bootstrap/coding-tooling

      - name: Check out pinned coding agent conventions
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: moritzbrantner/coding-agent-conventions
          ref: 8965e9274ec214146bfb18ed9ca1f8586b0617b8
          path: .bootstrap/coding-agent-conventions

      - name: Materialize repository foundation conventions
        run: |
          bun .bootstrap/coding-tooling/src/cli.ts bootstrap apply \
            --root . \
            --conventions-root .bootstrap/coding-agent-conventions \
            --json
          bun .bootstrap/coding-tooling/src/cli.ts conventions add ui \
            --root . \
            --conventions-root .bootstrap/coding-agent-conventions \
            --json
          rm -rf .bootstrap

      - name: Commit generated convention snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .conventions conventions.json conventions.lock.json renovate.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: lock coding-agent conventions"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
