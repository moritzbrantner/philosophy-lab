name: Apply canonical formatting

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chore/repository-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Philosophy Lab branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Prepare declared environment
        run: bash scripts/codex-environment.sh setup

      - name: Apply repository formatter
        run: bun run format

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .coding-tooling.json tests/integration/content-contract.test.ts web/src/argument-state.ts web/src/exhibits.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply canonical formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
